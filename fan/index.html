<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAN POWERS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#020a10">

  html,body{margin:0;height:100%;background:#020a10;color:#a9e6ff;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}

<body>
<div id="start">
  <svg width="96" height="96" viewBox="-50 -50 100 100"><circle r="44" fill="none" stroke="#bff0ff" stroke-width="4"/>
    <g fill="#e3fbff"><path id="bl" d="M4 -4 Q22 -34 36 -14 Q24 -8 6 2Z"/><use href="#bl" transform="rotate(72)"/><use href="#bl" transform="rotate(144)"/>
    <use href="#bl" transform="rotate(216)"/><use href="#bl" transform="rotate(288)"/></g><circle r="7" fill="#e3fbff"/></svg>
  <h1>FAN POWERS</h1>
  <div id="link">PC LINK · CHECKING…</div>
  <button id="go">TAKE CONTROL</button>
  <div id="moves">
    <b>POINT + HOLD</b><span>lock onto your fan</span>
    <b>PUSH</b><span>open palm, shove it at the fan = wind up</span>
    <b>BOTH HANDS</b><span>push together = FULL POWER</span>
    <b>PINCH + DRAG</b><span>up / down = dial the speed</span>
    <b>SWIPE</b><span>sideways = swing on / off</span>
    <b>FIST</b><span>squeeze = kill it</span>
  </div>
  <div id="msg"></div>
  <a class="nav" href="../">← J.A.R.V.I.S.</a>
  <div style="position:absolute;bottom:16px;font-size:14px;letter-spacing:4px;color:#7fd4ff;opacity:.8">VERSION 1</div>
</div>
<script type="module">
import * as THREE from '../vendor/three.module.js';

const Q = new URLSearchParams(location.search);
const PREVIEW = Q.has('preview');
const NOLINK = Q.has('nolink') || PREVIEW;

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.02, 60);
camera.position.set(0, 1.65, 0);
scene.add(camera);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const head = { pos: new THREE.Vector3(0, 1.65, 0), quat: new THREE.Quaternion(), fwd: new THREE.Vector3(0, 0, -1) };
const tA = new THREE.Vector3(), tB = new THREE.Vector3(), tC = new THREE.Vector3(), tQ = new THREE.Quaternion();
const UP = new THREE.Vector3(0, 1, 0);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const st = { started: false, t: 0 };

// ---------------------------------------------------------------- the fan: wanted state (instant) + real state (from the PC link)
const want = { power: false, speed: 6, swing: false };
const real = { power: false, speed: 0, swing: false };
const LINK = { url: null, ok: false, fails: 0, inflight: false, dirty: false, lastSend: 0, lastPoll: 0, finding: false, fanOnline: false, synced: false };
const TOPIC = 'https://ntfy.sh/mk-fanpowers-7q2vx9/json?poll=1&since=12h';

async function findLink() {
  if (LINK.finding) return; LINK.finding = true;
  try {
    const txt = await (await fetch(TOPIC, { cache: 'no-store' })).text();
    const msgs = txt.trim().split('\n').filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === 'message');
    const u = msgs.length ? msgs[msgs.length - 1].message.trim() : null;
    if (u && u !== LINK.url) { LINK.url = u; LINK.fails = 0; }
    if (u) await poll();
  } catch (e) {}
  LINK.finding = false;
}
function took(j) {
  LINK.ok = true; LINK.fails = 0; LINK.fanOnline = !!j.online;
  real.power = j.fan.power; real.speed = j.fan.speed; real.swing = j.fan.swing;
  if (!LINK.synced && j.online) {   // first contact: start from what the fan is really doing
    LINK.synced = true; want.power = real.power; if (real.speed) want.speed = real.speed; want.swing = real.swing;
  } else if (j.online && !LINK.dirty && !LINK.inflight && performance.now() - LINK.lastSend > 6000) {
    // someone used the fan's own buttons / remote: follow the real fan
    want.power = real.power; if (real.speed) want.speed = real.speed; want.swing = real.swing;
  }
}
function failed() { LINK.fails++; if (LINK.fails >= 2) { LINK.ok = false; LINK.url = null; } }
async function poll() {
  if (!LINK.url) return; LINK.lastPoll = performance.now();
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
    took(await (await fetch(LINK.url + '/state', { cache: 'no-store', signal: ctl.signal })).json());
  } catch (e) { failed(); }
}
async function pushState() {
  LINK.dirty = false; LINK.inflight = true; LINK.lastSend = performance.now();
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
    const body = JSON.stringify(want.power ? { power: true, speed: want.speed, swing: want.swing } : { power: false, swing: want.swing });
    took(await (await fetch(LINK.url + '/cmd', { method: 'POST', body, signal: ctl.signal })).json());   // text/plain = no preflight
  } catch (e) { failed(); LINK.dirty = true; }
  LINK.inflight = false;
}
function linkTick(now) {
  if (NOLINK) {   // preview: a pretend fan that follows a beat behind
    LINK.ok = LINK.fanOnline = true;
    if (now - (LINK.fake || 0) > 400) { LINK.fake = now; real.power = want.power; real.speed = want.power ? want.speed : 0; real.swing = want.swing; }
    return;
  }
  if (!LINK.url) { if (now - (LINK.lastFind || 0) > 3000) { LINK.lastFind = now; findLink(); } return; }
  if (LINK.dirty && !LINK.inflight && now - LINK.lastSend > 120) pushState();
  else if (!LINK.inflight && now - LINK.lastPoll > 1500 && now - LINK.lastSend > 800) poll();
}
function command() { LINK.dirty = true; }

// ---------------------------------------------------------------- audio
let AC = null, master = null, verb = null;
const VOICE = {};
const VOICES = ['boot', 'linked', 'on', 'max', 'off', 'swing_on', 'swing_off', 'offline'];
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  const len = AC.sampleRate * 1.8, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  verb = AC.createConvolver(); verb.buffer = ir; const vg = AC.createGain(); vg.gain.value = 0.25; verb.connect(vg); vg.connect(master);
  for (const n of VOICES) fetch('audio/' + n + '.mp3').then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).then(buf => VOICE[n] = buf).catch(() => {});
  windSound();
}
let voiceSrc = null, lastVoice = 0;
function say(name, force = false) {
  if (!AC || !VOICE[name]) return;
  if (!force && performance.now() - lastVoice < 6000) return;
  lastVoice = performance.now();
  if (voiceSrc) try { voiceSrc.stop(); } catch (e) {}
  voiceSrc = AC.createBufferSource(); voiceSrc.buffer = VOICE[name]; voiceSrc.connect(master); voiceSrc.start();
}
function out(node, wet = true) { node.connect(master); if (wet) node.connect(verb); }
function noise(sec) { const b = AC.createBuffer(1, AC.sampleRate * sec, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
// the wind + the motor: always running, volume follows the fan
const SND = {};
function windSound() {
  const n = AC.createBufferSource(); n.buffer = noise(4); n.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7; bp.frequency.value = 400;
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : AC.createGain();
  const g = AC.createGain(); g.gain.value = 0; n.connect(bp); bp.connect(g); g.connect(pan); out(pan); n.start();
  // BRORORO: a low saw through a lowpass, chopped by a tremolo that speeds up with the fan
  const m = AC.createOscillator(); m.type = 'sawtooth'; m.frequency.value = 40;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
  const mg = AC.createGain(); mg.gain.value = 0;
  const trem = AC.createGain(); trem.gain.value = 0.5;
  const lfo = AC.createOscillator(); lfo.frequency.value = 6; const lfoG = AC.createGain(); lfoG.gain.value = 0.5;
  lfo.connect(lfoG); lfoG.connect(trem.gain);
  m.connect(lp); lp.connect(trem); trem.connect(mg); out(mg, false); m.start(); lfo.start();
  Object.assign(SND, { g, bp, pan, mg, m, lfo, lp });
}
function updateSound(level, swingPan) {
  if (!AC || !SND.g) return; const t = AC.currentTime, k = level / 12;
  SND.g.gain.setTargetAtTime(0.02 + k * 0.2 * (level > 0.05 ? 1 : 0), t, 0.25);
  if (level < 0.05) SND.g.gain.setTargetAtTime(0, t, 0.4);
  SND.bp.frequency.setTargetAtTime(260 + k * 900, t, 0.3);
  SND.mg.gain.setTargetAtTime(level > 0.05 ? 0.03 + k * 0.09 : 0, t, 0.3);
  SND.m.frequency.setTargetAtTime(34 + k * 30, t, 0.3); SND.lfo.frequency.setTargetAtTime(4 + k * 14, t, 0.3);
  SND.lp.frequency.setTargetAtTime(140 + k * 260, t, 0.3);
  if (SND.pan.pan) SND.pan.pan.setTargetAtTime(swingPan * 0.6, t, 0.2);
}
function whoosh(big = 1) {
  if (!AC) return; const t = AC.currentTime;
  const n = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  n.buffer = noise(1.2); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200 * big, t + 0.25); f.frequency.exponentialRampToValueAtTime(500, t + 0.9);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5 * big, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
  n.connect(f); f.connect(g); out(g); n.start(t);
  const o = AC.createOscillator(), og = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.4);
  og.gain.setValueAtTime(0.6 * big, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.45); o.connect(og); out(og, false); o.start(t); o.stop(t + 0.5);
}
function sweep(up) {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(up ? 60 : 220, t); o.frequency.exponentialRampToValueAtTime(up ? 260 : 35, t + (up ? 0.6 : 0.9));
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
  g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (up ? 0.7 : 1.0)); o.connect(f); f.connect(g); out(g); o.start(t); o.stop(t + 1.1);
  if (!up) { const n = AC.createBufferSource(), ng = AC.createGain(), nf = AC.createBiquadFilter(); n.buffer = noise(0.3); nf.type = 'lowpass'; nf.frequency.value = 900;
    ng.gain.setValueAtTime(0.5, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.25); n.connect(nf); nf.connect(ng); out(ng); n.start(t); }
}
function tick(level) {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.value = 500 + level * 70; g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o.connect(g); out(g, false); o.start(t); o.stop(t + 0.1);
}
function lockBlip() {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(1320, t + 0.25);
  g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(g); out(g); o.start(t); o.stop(t + 0.55);
}

// ---------------------------------------------------------------- textures
function radialTex(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); stops.forEach(([k, col]) => gr.addColorStop(k, col));
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(170,240,255,0.8)'], [0.6, 'rgba(60,190,255,0.25)'], [1, 'rgba(20,120,255,0)']]);
const softTex = radialTex([[0, 'rgba(210,245,255,0.9)'], [0.5, 'rgba(90,200,255,0.3)'], [1, 'rgba(40,140,255,0)']]);
const ADD = { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false };
const C_LOW = new THREE.Color(0x58d6ff), C_MID = new THREE.Color(0xeafcff), C_HOT = new THREE.Color(0xff7a2e);
function levelColor(l, out = new THREE.Color()) {   // 1..12: cyan -> white -> orange
  const k = clamp((l - 1) / 11, 0, 1);
  return k < 0.6 ? out.copy(C_LOW).lerp(C_MID, k / 0.6) : out.copy(C_MID).lerp(C_HOT, (k - 0.6) / 0.4);
}

// ---------------------------------------------------------------- fan hologram (sits on the real fan, always faces you)
const FAN = { pos: new THREE.Vector3(0, 1.0, -2.2), bound: false, g: new THREE.Group(), spin: 0, ang: 0, level: 0, appear: 0 };
scene.add(FAN.g); FAN.g.visible = false;
const R0 = 0.21;
const bladeShape = new THREE.Shape();
bladeShape.moveTo(0.03, -0.012); bladeShape.quadraticCurveTo(0.11, -0.06, R0 - 0.005, 0.0); bladeShape.quadraticCurveTo(0.15, 0.055, 0.03, 0.016); bladeShape.closePath();
const bladeGeo = new THREE.ShapeGeometry(bladeShape, 10);
const bladeMat = new THREE.MeshBasicMaterial({ color: 0x9fe8ff, opacity: 0.35, side: THREE.DoubleSide, ...ADD });
FAN.rotor = new THREE.Group();
for (let i = 0; i < 5; i++) { const b = new THREE.Mesh(bladeGeo, bladeMat); b.rotation.z = i * Math.PI * 2 / 5; FAN.rotor.add(b); }
// motion blur disc: shows when it really spins
FAN.blur = new THREE.Mesh(new THREE.CircleGeometry(R0, 64), new THREE.MeshBasicMaterial({ map: softTex, color: 0x7fe0ff, opacity: 0, ...ADD }));
FAN.rim = new THREE.Mesh(new THREE.RingGeometry(R0 + 0.006, R0 + 0.014, 96), new THREE.MeshBasicMaterial({ color: 0xbff4ff, opacity: 0.8, side: THREE.DoubleSide, ...ADD }));
FAN.hub = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xcff6ff, ...ADD })); FAN.hub.scale.setScalar(0.12);
FAN.halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0x4fc8ff, opacity: 0.3, ...ADD })); FAN.halo.scale.setScalar(0.9);
// 12-segment power gauge around it (270 degrees, bottom gap)
FAN.segs = [];
for (let i = 0; i < 12; i++) {
  const span = Math.PI * 1.5 / 12, start = Math.PI * 1.25 - (i + 1) * span;
  const s = new THREE.Mesh(new THREE.RingGeometry(R0 + 0.04, R0 + 0.075, 6, 1, start + 0.02, span - 0.04),
    new THREE.MeshBasicMaterial({ color: levelColor(i + 1), opacity: 0.12, side: THREE.DoubleSide, ...ADD }));
  FAN.segs.push(s); FAN.g.add(s);
}
// swing sweep arc + the label
FAN.sweepArc = new THREE.Mesh(new THREE.RingGeometry(R0 + 0.1, R0 + 0.13, 48, 1, 0, Math.PI * 0.7), new THREE.MeshBasicMaterial({ color: 0xbff4ff, opacity: 0, side: THREE.DoubleSide, ...ADD }));
FAN.swingT = 9;
const label = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 160; const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.175), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  m.position.set(0, R0 + 0.2, 0); return { c, g: c.getContext('2d'), tex, m, key: '' };
})();
FAN.g.add(FAN.halo, FAN.blur, FAN.rotor, FAN.rim, FAN.hub, FAN.sweepArc, label.m);
function drawLabel() {
  const on = want.power, lv = want.speed;
  const linkTxt = !LINK.ok ? 'PC LINK OFFLINE' : !LINK.fanOnline ? 'FAN NOT ANSWERING' : (real.power === want.power && (!want.power || real.speed === want.speed)) ? 'LIVE' : 'SENDING…';
  const key = [on, lv, want.swing, linkTxt].join('|'); if (key === label.key) return; label.key = key;
  const { g, c } = label; g.clearRect(0, 0, c.width, c.height);
  g.textAlign = 'center';
  g.font = '700 74px "Segoe UI", Arial'; g.fillStyle = on ? '#' + levelColor(lv).getHexString() : '#5d7c8a';
  g.shadowColor = '#3fc8ff'; g.shadowBlur = 18;
  g.fillText(on ? (lv >= 12 ? 'MAX' : 'POWER ' + lv) : 'OFF', c.width / 2, 78);
  g.shadowBlur = 0; g.font = '600 28px "Segoe UI", Arial';
  g.fillStyle = LINK.ok && LINK.fanOnline ? 'rgba(170,235,255,0.85)' : '#ff9a6a';
  g.fillText((want.swing ? 'SWING · ' : '') + linkTxt, c.width / 2, 132);
  label.tex.needsUpdate = true;
}

// ---------------------------------------------------------------- wind: streaks pouring off the fan toward you
const WN = 900;
const wind = {
  t: new Float32Array(WN), r: new Float32Array(WN), a: new Float32Array(WN), s: new Float32Array(WN),
  geo: new THREE.BufferGeometry(), dir: new THREE.Vector3(0, 0, 1), right: new THREE.Vector3(1, 0, 0), up: new THREE.Vector3(0, 1, 0), suck: 0, sw: 0, swAmp: 0,
};
wind.geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(WN * 6), 3));
wind.geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(WN * 6), 3));
wind.lines = new THREE.LineSegments(wind.geo, new THREE.LineBasicMaterial({ vertexColors: true, ...ADD }));
wind.lines.frustumCulled = false; scene.add(wind.lines);
const motesGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(260 * 3), 3));
wind.motes = new THREE.Points(motesGeo, new THREE.PointsMaterial({ map: glowTex, size: 0.014, color: 0xbff0ff, opacity: 0.7, ...ADD }));
wind.motes.frustumCulled = false; scene.add(wind.motes);
function respawn(i) { wind.t[i] = Math.random() * 0.05; wind.r[i] = Math.sqrt(Math.random()) * R0; wind.a[i] = Math.random() * Math.PI * 2; wind.s[i] = rand(0.6, 1.2); }
for (let i = 0; i < WN; i++) { respawn(i); wind.t[i] = Math.random(); }
const wc = new THREE.Color();
function windPoint(i, t, L, out) {
  const spread = 1 + t * 3.2, ang = wind.a[i] + t * 4.0;   // spirals out as it travels
  const r = wind.r[i] * spread;
  return out.copy(FAN.pos).addScaledVector(wind.dir, t * L).addScaledVector(wind.right, Math.cos(ang) * r).addScaledVector(wind.up, Math.sin(ang) * r * 0.8);
}
function updateWind(dt, now) {
  const k = FAN.level / 12;
  // aim the wind at your head, swinging left/right when swing is on
  wind.swAmp += ((want.power && want.swing ? 0.75 : 0) - wind.swAmp) * Math.min(1, dt * 1.5);
  wind.sw = Math.sin(now / 1000 * Math.PI * 2 / 12) * wind.swAmp;
  tA.copy(head.pos).sub(FAN.pos); tA.y *= 0.4; const L = Math.min(5, tA.length() + 0.8); tA.normalize();
  wind.dir.copy(tA).applyAxisAngle(UP, wind.sw);
  wind.right.crossVectors(wind.dir, UP).normalize(); wind.up.crossVectors(wind.right, wind.dir).normalize();
  const active = FAN.bound ? Math.floor(WN * Math.pow(k, 0.6)) : 0;
  const pos = wind.geo.attributes.position.array, col = wind.geo.attributes.color.array, mp = motesGeo.attributes.position.array;
  levelColor(Math.max(1, FAN.level), wc);
  const v = 0.12 + k * 0.85, tail = 0.025 + k * 0.06;
  for (let i = 0; i < WN; i++) {
    if (i >= active && wind.suck <= 0) { pos.fill(0, i * 6, i * 6 + 6); col.fill(0, i * 6, i * 6 + 6); if (i < 260) mp.fill(0, i * 3, i * 3 + 3); continue; }
    wind.t[i] += dt * wind.s[i] * (wind.suck > 0 ? -2.4 : v);
    if (wind.t[i] > 1) respawn(i);
    if (wind.t[i] < 0) { wind.t[i] = 0; wind.r[i] *= 0.5; }

// ---------------------------------------------------------------- gestures -> powers
const BIND_HOLD = 0.7, REBIND_HOLD = 1.6;
function updateHands(dt, now) {
  let aiming = null;

    const h = hands[side];
    h.pushCD -= dt; h.swipeCD -= dt;
    if (!h.has) { h.seen = 0; h.g = 'none'; h.pinch = false; continue; }
    handMotion(h, dt);
    const g = classify(h);
    if (g !== h.g) { h.g = g; h.gT = 0; } else h.gT += dt;
    if (g === 'open') h.openT = now;

    // POINT + HOLD = lock the fan
    if (g === 'point' && h.rayOK) aiming = h;

    // PINCH + DRAG = speed dial
    if (g === 'pinch' && FAN.bound) {
      if (!h.pinch) { h.pinch = true; h.pinchY0 = h.J[9].y; h.pinchL0 = want.power ? want.speed : 0; }
      const lv = h.pinchL0 + (h.J[9].y - h.pinchY0) / 0.05;   // 5 cm per level
      if (Math.abs(h.J[9].y - h.pinchY0) > 0.035 || want.power) dialTo(Math.max(1, lv));
      dial.m.visible = true; drawDial(want.speed);
      dial.m.position.copy(h.J[9]).add(tB.set(0, 0.1, 0)); dial.m.quaternion.copy(head.quat);
    } else if (h.pinch && g !== 'pinch') { h.pinch = false; }

    tB.copy(h.vel).addScaledVector(toFan, -along); tB.y *= 0.5; const lateral = tB.length();

      h.pushCD = 0.7; h.pushT = now; pushers.push({ h, s: clamp((along - 1.1) / 1.4, 0, 1) });
    }
    // SWIPE: open hand whipped sideways
    else if ((g === 'open' || g === 'none') && h.swipeCD <= 0 && h.pushCD <= 0.3 && lateral > 1.7 && lateral > Math.abs(along) * 1.6 && Math.abs(h.vel.y) < lateral * 0.7) {

  tA.copy(head.pos); tA.y = FAN.pos.y + (head.pos.y - FAN.pos.y) * 0.3; FAN.g.lookAt(tA);   // faces you, mostly upright
  const e = 1 - Math.pow(1 - FAN.appear, 3); FAN.g.scale.setScalar(0.3 + 0.7 * e);
  const k = FAN.level / 12;
  FAN.spin = k * 34; FAN.ang -= FAN.spin * dt; FAN.rotor.rotation.z = FAN.ang;
  bladeMat.opacity = 0.42 - k * 0.22; bladeMat.color.copy(levelColor(Math.max(1, FAN.level)));
  FAN.blur.material.opacity = k * 0.55; FAN.blur.material.color.copy(levelColor(Math.max(1, FAN.level)));
  FAN.hub.material.opacity = 0.5 + k * 0.5; FAN.halo.material.opacity = 0.12 + k * 0.4 + (wind.suck > 0 ? 0.3 : 0);
  FAN.halo.material.color.copy(levelColor(Math.max(1, FAN.level)));
  const lit = want.power ? want.speed : 0;
  FAN.segs.forEach((s, i) => { const on = i < lit; s.material.opacity += ((on ? 0.95 : 0.1) - s.material.opacity) * Math.min(1, dt * 10); s.scale.setScalar(on && i === lit - 1 ? 1 + Math.sin(now / 90) * 0.02 : 1); });
  FAN.rim.material.opacity = LINK.ok && LINK.fanOnline ? 0.8 : 0.3 + Math.abs(Math.sin(now / 300)) * 0.4;
  FAN.rim.material.color.set(LINK.ok && LINK.fanOnline ? 0xbff4ff : 0xff8a5a);
  // swing sweep arc
  FAN.swingT += dt; const sk = FAN.swingT / 0.7;
  FAN.sweepArc.material.opacity = sk < 1 ? (1 - sk) * 0.9 : (want.swing && want.power ? 0.15 + 0.1 * Math.sin(now / 400) : 0);
  if (sk < 1) FAN.sweepArc.rotation.z += dt * 9; else FAN.sweepArc.rotation.z = Math.PI * 0.15 + wind.sw * 1.2;
  drawLabel();
}

// ---------------------------------------------------------------- main loop
let lastT = performance.now();
function loop(time, frame) {
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (frame) {
    const ref = renderer.xr.getReferenceSpace(), pose = frame.getViewerPose(ref);
    if (pose) { const p = pose.transform.position, o = pose.transform.orientation; head.pos.set(p.x, p.y, p.z); head.quat.set(o.x, o.y, o.z, o.w); }
    if (frame.detectedPlanes) for (const pl of frame.detectedPlanes) {
      const key = pl.__k || (pl.__k = 'p' + Math.random().toString(36).slice(2));
      const pp = frame.getPose(pl.planeSpace, ref); if (pp) upsertRoom(key, () => planeGeo(pl), pp.transform.matrix, pl.lastChangedTime);
    }
    if (frame.detectedMeshes) for (const me of frame.detectedMeshes) {
      const key = me.__k || (me.__k = 'm' + Math.random().toString(36).slice(2));
      const mp = frame.getPose(me.meshSpace, ref); if (mp) upsertRoom(key, () => meshGeo(me), mp.transform.matrix, me.lastChangedTime);
    }
    hands.left.has = hands.right.has = false; hands.left.rayOK = hands.right.rayOK = false;
    for (const src of frame.session.inputSources) {
      if (src.hand) {
        const h = hands[src.handedness] || hands.right;
        readHand(frame, ref, src, h);
        const rp = src.targetRaySpace && frame.getPose(src.targetRaySpace, ref);
        if (rp) { h.rayOK = true; h.rayO.copy(rp.transform.position); h.rayD.set(0, 0, -1).applyQuaternion(tQ.copy(rp.transform.orientation)); }
      } else if (st.started) readPad(src, frame, ref);
    }
  }
  step(dt, now);
  renderer.render(scene, camera);
}
function step(dt, now) {
  if (PREVIEW) {
    camera.position.set(0.15, 1.55, 0.6); camera.rotation.set(-0.12, 0.05, 0, 'YXZ');
    camera.updateMatrixWorld(); head.pos.copy(camera.position); head.quat.copy(camera.quaternion);
    if (demoT >= 0) { demoT += dt; runDemo(); }
  }
  head.fwd.set(0, 0, -1).applyQuaternion(head.quat);
  linkTick(now);
  if (!st.started) return;
  st.t += dt;
  updateHands(dt, now);
  for (const side of ['left', 'right']) updateHandVisual(hands[side], dt);
  updateFan(dt, now); updateWind(dt, now); updateFx(dt);
  updateSound(FAN.bound ? FAN.level : 0, wind.sw);
  hint.m.position.copy(head.pos).addScaledVector(head.fwd, 0.9).addScaledVector(tA.set(0, 1, 0).applyQuaternion(head.quat), -0.3);
  hint.m.quaternion.copy(head.quat);
  if (!FAN.bound) setHint('POINT AT YOUR FAN · HOLD', 'index finger out, keep it steady' + (LINK.ok ? '' : ' · PC link not found yet'));
  else if (!LINK.ok) setHint('PC LINK OFFLINE', 'double-click FAN POWERS on your PC');
  else if (!LINK.fanOnline) setHint('FAN NOT ANSWERING', 'is it plugged in?');
  else if (st.t < 25 || now - (st.lastAct || 0) > 30000) setHint('PUSH · PINCH+DRAG · SWIPE · FIST', 'both hands push = FULL POWER · point+hold = move the fan lock');
  else setHint('');
  if (LINK.wasOk && !LINK.ok && now - (st.offT || 0) > 30000) { st.offT = now; say('offline', true); }
  LINK.wasOk = LINK.ok;
  if (PREVIEW) document.title = 'lv=' + FAN.level.toFixed(1) + ' want=' + JSON.stringify(want);
}
renderer.setAnimationLoop(loop);

// scripted demo for ?preview: lock the fan, push, dial, swing, turbo, fist
let demoT = -1; const demoDone = new Set();
function at(t, key, f) { if (demoT >= t && !demoDone.has(key)) { demoDone.add(key); f(); } }
function runDemo() {
  at(0.2, 'bind', () => bindFan(new THREE.Vector3(-0.1, 0.95, -1.4)));
  at(1.0, 'push', () => doPush(new THREE.Vector3(0.25, 1.3, 0.2), 0.3));
  at(2.0, 'dial', () => dialTo(9));
  if (Q.has('swing')) at(2.6, 'swing', () => doSwing(new THREE.Vector3(0.3, 1.3, 0.2)));
  if (Q.has('turbo')) at(3.0, 'turbo', () => doTurbo(new THREE.Vector3(-0.2, 1.3, 0.2), new THREE.Vector3(0.3, 1.3, 0.2)));
  if (Q.has('kill')) at(4.0, 'kill', () => doKill(new THREE.Vector3(0.2, 1.3, 0.2)));
}
function demo() {
  demoT = 0; step(0, performance.now());
  const T = parseFloat(Q.get('t') || '0'); let fake = performance.now();
  for (let i = 0; i < T * 60; i++) { fake += 1000 / 60; step(1 / 60, fake); }
  lastT = performance.now();
}

// ---------------------------------------------------------------- start
const go = document.getElementById('go'), msg = document.getElementById('msg'), start = document.getElementById('start'), linkEl = document.getElementById('link');
setInterval(() => {   // start screen shows if the PC side is up before you dive in
  if (start.style.display === 'none') return;
  linkEl.textContent = LINK.ok ? (LINK.fanOnline ? 'PC LINK · ONLINE · FAN ' + (real.power ? 'ON ' + real.speed : 'OFF') : 'PC LINK · ONLINE · FAN NOT ANSWERING') : 'PC LINK · OFFLINE — double-click FAN POWERS on the PC';
  linkEl.style.color = LINK.ok && LINK.fanOnline ? '#9ff0c0' : '#ffb08a'; linkEl.style.borderColor = linkEl.style.color;
}, 700);
function begin() {
  st.started = true; st.t = 0;
  setTimeout(() => say('boot', true), 700);
}
async function enter() {
  initAudio(); if (AC.state === 'suspended') AC.resume();
  if (PREVIEW) { start.style.display = 'none'; scene.background = new THREE.Color(0x101820); begin(); demo(); return; }
  if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar').catch(() => false))) {
    msg.textContent = 'Open this page in the Quest browser. (Add ?preview to see it on a monitor.)'; return;
  }
  try {
    const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local-floor'], optionalFeatures: ['hand-tracking', 'plane-detection', 'mesh-detection'] });
    renderer.xr.setReferenceSpaceType('local-floor'); renderer.xr.setFoveation(1);
    await renderer.xr.setSession(session);
    start.style.display = 'none';
    session.addEventListener('end', () => { start.style.display = 'flex'; st.started = false; FAN.bound = false; FAN.g.visible = false; });
    diag({ app: 'fan', start: true, feats: session.enabledFeatures || 'n/a', link: LINK.ok, url: LINK.url });
    begin();
  } catch (e) { msg.textContent = 'Could not start: ' + e.message; diag({ app: 'fan', startErr: e.message }); }
}
go.addEventListener('click', enter);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
if (PREVIEW && Q.has('auto')) setTimeout(enter, 100);
</script>
