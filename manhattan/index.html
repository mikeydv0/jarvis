    const same = h && !h.fading && h.state === 'hover' && ((hit.kind === 'vox' && h.voxObj && h.keys.has(hit.key)) || (hit.kind === 'depth' && h.depthObj && hit.p.distanceTo(h.anchor) < 0.15) || (hit.kind === 'plane' && h.plane === hit.s) || (hit.kind === 'mesh' && h.m === hit.m && hit.p.distanceTo(h.anchor) < 0.3));
    const onLocked = st.locked && st.locked.state === 'locked' && ((hit.kind === 'vox' && st.locked.voxObj && st.locked.keys.has(hit.key)) || (hit.kind === 'depth' && st.locked.depthObj && hit.p.distanceTo(st.locked.anchor) < 0.2) || (hit.kind === 'plane' && st.locked.plane === hit.s) || (hit.kind === 'mesh' && st.locked.m === hit.m && hit.p.distanceTo(st.locked.anchor) < 0.3));
    if (onLocked) { st.lockT = now; }
    else if (same) st.hoverT += dt;
    else if (now - st.lastBuild > 160) {
      if (h && h.state === 'hover') h.fading = true;
      st.hover = targetFor(hit); st.hoverT = 0; st.lastBuild = now;
    }
  } else if (st.hover && st.hover.state === 'hover') { st.hover.fading = true; st.hover = null; }
  if (st.hover && st.hover.state === 'hover' && !st.hover.fading && st.hoverT > 0.4) {
    if (st.locked && st.locked.state === 'locked') { st.locked.state = 'hover'; st.locked.fading = true; }
    st.locked = st.hover; st.hover = null; st.locked.state = 'locked'; st.lockT = now; lockBlip(); hum(true);
  }
  if (st.locked && st.locked.state === 'locked' && now - st.lockT > 7000) { st.locked.state = 'hover'; st.locked.fading = true; st.locked = null; hum(false); }

  if (st.started && !st.capTried && now - st.t0 > 3500 && !PREVIEW && scanThin()) tryCapture();

  // hints until the player has done the whole loop once
  let t = null;
  if (st.needPinch) t = 'PINCH TO SCAN YOUR ROOM';
  else if (st.noCapture && scanThin()) t = 'DO SPACE SETUP IN QUEST SETTINGS FIRST';
  else if (counts.release === 0) {
    if (latest('crushed')) t = 'OPEN YOUR HAND';
    else if (latest('exploded')) t = 'MAKE A FIST';
    else if (st.locked && st.locked.state === 'locked') t = 'OPEN YOUR HAND';
    else if (!hands.left.has && !hands.right.has && !PREVIEW) t = st.ctrl ? 'PUT THE CONTROLLERS DOWN' : 'SHOW ME YOUR HANDS';
    else t = 'POINT AT SOMETHING';
  }
  setHint(t, (PREVIEW || now - st.t0 < 15000 || !DEP.ok) ? DEP.status : '');
  if (!PREVIEW && now - (st.diagT || 0) > 1500) { st.diagT = now; diag({ status: DEP.status, mode: DEP.mode, info: DEP.info, aim: st.aim ? st.aim.kind : null, vox: VX.map.size, obj: st.lastObjN || 0, meshes: meshes.size, planes: planes.size }); }   // stays up while depth isn't working
}

// ---------------------------------------------------------------- main loop
let lastT = performance.now();
function loop(time, frame) {
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (frame) {
    const ref = renderer.xr.getReferenceSpace(), pose = frame.getViewerPose(ref);
    if (pose) { const p = pose.transform.position, o = pose.transform.orientation; head.pos.set(p.x, p.y, p.z); head.quat.set(o.x, o.y, o.z, o.w); }
    if (frame.detectedPlanes) {
      const alive = new Set();
      for (const pl of frame.detectedPlanes) {
        const key = pl.__k || (pl.__k = 'p' + Math.random().toString(36).slice(2)); alive.add(key);
        const pp = frame.getPose(pl.planeSpace, ref); if (pp) upsertPlane(key, pl, pl.semanticLabel || pl.orientation, pp.transform.matrix, pl.lastChangedTime);
      }
      for (const [k, s] of planes) if (!alive.has(k) && !s.gone) { scene.remove(s.group); planes.delete(k); rebuildPlaneHits(); }
    }
    if (frame.detectedMeshes) {
      for (const me of frame.detectedMeshes) {
        const key = me.__k || (me.__k = 'm' + Math.random().toString(36).slice(2));
        if (meshes.has(key) && !canRebuild(meshes.get(key), me.lastChangedTime)) continue;   // don't touch XR data unless it changed
        const mp = frame.getPose(me.meshSpace, ref); if (mp) upsertMesh(key, me, me.semanticLabel || 'other', mp.transform.matrix, me.lastChangedTime);
      }
    }
    if (pose && st.started && now - DEP.at > (st.wantDepth ? 140 : 250) && now - (DEP.tried || 0) > 140) { DEP.tried = now; depthRead(frame, pose); }
    hands.left.has = hands.right.has = false; hands.left.rayOK = hands.right.rayOK = false; st.ctrl = false;
    for (const src of frame.session.inputSources) {
      if (src.hand) {
        const h = hands[src.handedness] || hands.right;
        readHand(frame, ref, src, h);
        const rp = src.targetRaySpace && frame.getPose(src.targetRaySpace, ref);
        if (rp) { h.rayOK = true; h.rayO.copy(rp.transform.position); h.rayD.set(0, 0, -1).applyQuaternion(tQ.copy(rp.transform.orientation)); }
      } else st.ctrl = true;
    }
  }
  step(dt, now);
  renderer.render(scene, camera);
}
function step(dt, now) {
  if (PREVIEW) {
    const s = now / 1000;
    camera.position.set(0.2, 1.55, 0.9);
    camera.rotation.set(-0.42 + Math.sin(s * 0.3) * 0.02, 0.12 + Math.sin(s * 0.2) * 0.04, 0, 'YXZ');
    camera.updateMatrixWorld(); head.pos.copy(camera.position); head.quat.copy(camera.quaternion);
    if (demoT >= 0) { demoT += dt; runDemo(); }
  }
  head.fwd.set(0, 0, -1).applyQuaternion(head.quat);
  if (!st.started) return;
  updateInteraction(dt, now);
  for (const side of ['left', 'right']) updateHandVisual(hands[side], dt);
  updateFrags(dt, now); updateDust(dt);
  motes.material.opacity = Math.min(0.6, motes.material.opacity + dt * 0.3);
  motes.rotation.y += dt * 0.01;
  hint.m.position.copy(head.pos).addScaledVector(head.fwd, 0.9).addScaledVector(tA.set(0, 1, 0).applyQuaternion(head.quat), -0.28);
  hint.m.quaternion.copy(head.quat);
  if (aimLine.material.opacity > 0 || frags.length) st.idleT = now;
  if (PREVIEW) document.title = 'vox=' + VX.map.size + ' aim=' + (st.aim ? st.aim.kind : '-') + ' obj=' + (st.lastObjN || 0) + ' frags=' + frags.map(f => f.voxObj ? 'V' : 'T').join('');
  else if (now - st.idleT > 60000 && counts.explode > 0) { st.idleT = now; say('idle'); }
}
renderer.setAnimationLoop(loop);

// scripted demo for ?preview, on sim time: point at the chair, lock, open = explode, point at the monitor, explode, (fist = crush, open = release)
let demoT = -1; const demoDone = new Set();
function at(t, key, f) { if (demoT >= t && !demoDone.has(key)) { demoDone.add(key); f(); } }
function aimAt(x, y, z) { const o = head.pos.clone().add(new THREE.Vector3(0.15, -0.25, -0.2)); st.fakeAim = { o, d: new THREE.Vector3(x, y, z).sub(o).normalize() }; }
function runDemo() {
  at(0.2, 'a1', () => aimAt(-0.9, 0.5, -0.72));
  at(1.4, 'e1', () => { st.fakeAim = null; onGesture('open'); });
  at(1.8, 'a2', () => aimAt(0.2, 1.0, -1.48));
  at(2.8, 'e2', () => { st.fakeAim = null; onGesture('open'); });
  if (Q.has('crush')) at(4.2, 'c1', () => onGesture('fist'));
  if (Q.has('release')) at(6.0, 'r1', () => onGesture('open'));
}
function depthSelfTest() {
  const W = 32, H = 32, data = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) data[i] = 0.5 + 0.49 * (i % W) / W;
  const t = new THREE.DataArrayTexture(data, W, H, 1); t.format = THREE.RedFormat; t.type = THREE.FloatType; t.needsUpdate = true;
  depMat.f.uniforms.tDepth.value = t; DEP.quad.material = depMat.f;
  renderer.setRenderTarget(DEP.rt); renderer.render(DEP.scene, DEP.cam); renderer.readRenderTargetPixels(DEP.rt, 0, 0, DEP.W, DEP.H, DEP.buf); renderer.setRenderTarget(null);
  const b = DEP.buf, px = k => (b[k * 4] / 255 + b[k * 4 + 1] / 65025 + b[k * 4 + 2] / 16581375) * 16;
  const left = px(80 * DEP.W + 2), right = px(80 * DEP.W + DEP.W - 3);
  const ok = Math.abs(left - 0.5) < 0.02 && Math.abs(right - 0.97) < 0.03;
  document.title = 'DEPTHTEST ' + (ok ? 'PASS' : 'FAIL') + ' left=' + left.toFixed(4) + ' right=' + right.toFixed(4);
  depMat.f.uniforms.tDepth.value = DEP.tex;
}
function fakeDepth() {
  camera.updateMatrixWorld(); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  DEP.proj.copy(camera.projectionMatrix); DEP.invProj.copy(camera.projectionMatrixInverse); DEP.viewM.copy(camera.matrixWorld); DEP.viewInv.copy(camera.matrixWorldInverse);
  DEP.mode = 'lin'; DEP.src = 'fake'; DEP.toM = 1;
  const o = camera.position.clone(), v = new THREE.Vector4(), dir = new THREE.Vector3(), c = new THREE.Vector4(), all = [...planes.values()].map(s => s.hit);
  for (let j = 0; j < DEP.H; j++) for (let i = 0; i < DEP.W; i++) {
    v.set(((i + 0.5) / DEP.W) * 2 - 1, ((j + 0.5) / DEP.H) * 2 - 1, 1, 1).applyMatrix4(DEP.invProj); v.divideScalar(v.w).applyMatrix4(DEP.viewM);
    dir.set(v.x, v.y, v.z).sub(o).normalize();
    ray.set(o, dir); ray.far = 8; const ph = ray.intersectObjects(all, false)[0], mh = rayMeshes(o, dir, 8);
    let t = Math.min(ph ? ph.distance : Infinity, mh ? mh.t : Infinity);
    if (!isFinite(t)) { DEP.D[j * DEP.W + i] = 0; continue; }
    const p = o.clone().addScaledVector(dir, t); c.set(p.x, p.y, p.z, 1).applyMatrix4(DEP.viewInv);
    DEP.D[j * DEP.W + i] = -c.z;
  }
  DEP.stamp++; DEP.ok = true; DEP.at = 1e15; DEP.status = 'LIVE DEPTH: PREVIEW (fake room)';
}
function demo() {
  if (Q.has('depthtest')) depthSelfTest();
  demoT = 0; step(0, performance.now()); fakeDepth(); fuseDepth(); fuseDepth(); fuseDepth();
  const T = parseFloat(Q.get('t') || '0'); let fake = performance.now();
  for (let i = 0; i < T * 60; i++) { fake += 1000 / 60; step(1 / 60, fake); }
  lastT = performance.now();
}

// ---------------------------------------------------------------- start
const go = document.getElementById('go'), msg = document.getElementById('msg'), start = document.getElementById('start');
function begin() { st.started = true; st.t0 = st.idleT = performance.now(); setTimeout(() => say('boot', true), 900); flash(head.pos.clone().addScaledVector(head.fwd, 1.2), 1.2, 1.2, softTex); }
async function enter() {
  initAudio(); if (AC.state === 'suspended') AC.resume();
  if (PREVIEW) { start.style.display = 'none'; scene.background = new THREE.Color(0x141a22); buildFakeRoom(); begin(); demo(); return; }
  if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar').catch(() => false))) {
    msg.textContent = 'Open this page in the Quest browser. (Add ?preview to see it on a monitor.)'; return;
  }
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'], optionalFeatures: ['hand-tracking', 'plane-detection', 'mesh-detection', 'depth-sensing'],
      depthSensing: { usagePreference: ['gpu-optimized'], dataFormatPreference: ['float32', 'luminance-alpha', 'unsigned-short'] },
    });
    renderer.xr.setReferenceSpaceType('local-floor'); renderer.xr.setFoveation(1);
    await renderer.xr.setSession(session);
    start.style.display = 'none';
    session.addEventListener('select', () => {
      if (!st.needPinch) return; st.needPinch = false;
      if (typeof session.initiateRoomCapture === 'function') session.initiateRoomCapture().catch(() => { st.noCapture = true; });
    });
    diag({ start: true, ua: navigator.userAgent.slice(0, 120), feats: session.enabledFeatures || 'n/a', usage: session.depthUsage, fmt: session.depthDataFormat, depthNear: session.renderState.depthNear });
    session.addEventListener('end', () => { start.style.display = 'flex'; st.started = false; });
    begin();
  } catch (e) { msg.textContent = 'Could not start: ' + e.message; diag({ startErr: e.message }); }
}
go.addEventListener('click', enter);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
if (PREVIEW && Q.has('auto')) setTimeout(enter, 100);
</script>
